name: Publish to NPM

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Check Version & Publish to NPM
        run: |
          LOCAL_VER=$(node -p "require('./package.json').version")
          REMOTE_VER=$(npm view velociforge@$LOCAL_VER version 2>/dev/null || true)
          
          # Detect if version was changed in package.json
          VERSION_CHANGED=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_CHANGED=true
          else
            OLD_VER=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf-8')).version" 2>/dev/null || true)
            if [ "$OLD_VER" != "$LOCAL_VER" ]; then
              VERSION_CHANGED=true
              echo "Detected version change in package.json: $OLD_VER ➔ $LOCAL_VER"
            fi
          fi

          if [ "$REMOTE_VER" = "$LOCAL_VER" ]; then
            echo "::notice::Version velociforge@$LOCAL_VER is already published on npm. Skipping."
          elif [ "$VERSION_CHANGED" = "true" ]; then
            if [ -z "$NODE_AUTH_TOKEN" ]; then
              echo "::error::NPM_TOKEN secret is missing in GitHub repository settings! Please add NPM_TOKEN to Repository Secrets."
              exit 1
            fi
            # Re-check live npm version right before publishing to avoid race conditions
            LIVE_CHECK=$(npm view velociforge@$LOCAL_VER version 2>/dev/null || true)
            if [ "$LIVE_CHECK" = "$LOCAL_VER" ]; then
              echo "::notice::Version velociforge@$LOCAL_VER was just published by a parallel trigger. Skipping duplicate publish."
            else
              echo "Publishing velociforge@$LOCAL_VER to npm..."
              npm publish --access public --provenance
            fi
          else
            echo "::notice::package.json version ($LOCAL_VER) did not change in this push. Skipping publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
