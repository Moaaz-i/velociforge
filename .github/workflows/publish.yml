name: Publish to NPM

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Publish to NPM
        run: |
          LOCAL_VER=$(node -p "require('./package.json').version")
          REMOTE_VER=$(npm view velociforge@$LOCAL_VER version 2>/dev/null || true)
          if [ "$REMOTE_VER" = "$LOCAL_VER" ]; then
            echo "::notice::Version velociforge@$LOCAL_VER is already published on npm. Skipping publish."
          else
            echo "Publishing velociforge@$LOCAL_VER to npm..."
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
